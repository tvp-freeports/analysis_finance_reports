      font: TrebuchetMS
    subfund_set:
      font: Arial-BoldItalicMT
      area:
        y_max: 60
    currency: EUR
    # algorithm-flags:
    #   - USE_RULER_AREA
    tolerance: 1.0
    row_tolerance: 0.5

