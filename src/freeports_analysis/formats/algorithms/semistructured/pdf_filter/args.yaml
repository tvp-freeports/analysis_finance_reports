    - font: TrebuchetMS-Bold
      text: "Titolo"

FIDEURAM-IT24:
  header_set:
    - font: Tahoma,Bold
      text: "Titolo"
    - font: Tahoma,Bold
      text: "Controvalore"

AMUNDI-IT24(investments):
