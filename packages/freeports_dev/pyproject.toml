[project]
name = "freeports-dev"
description = "Development tools for the freeports PDF extraction framework"
requires-python = ">=3.8"
license = "GPL-3.0"
version = "0.0.1"
authors = [
    {name = "Oreste Sciacqualegni", email = "orestesciacqualegni@tutanota.com"},
]
dependencies = [
    "freeports",
    "pytest",
    "dill",
    "pandas",
    "pyyaml",
    "PyMuPDF",
    "lxml",
]

[project.urls]
github = "https://github.com/tvp-freeports/analysis_finance_reports"
documentation = "https://docs.freeports.org"
homepage = "https://www.freeports.org"

[project.scripts]
freeports-dev = "freeports_dev.cli:main"

[project.entry-points.pytest11]
freeports_dev = "freeports_dev.pytest_plugin"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
# `lib/**/*` was missing: the JSON and template files `init-format-repo` and `setup-input-db`
# read at runtime live under `lib/`, not `data/`, so a non-editable install shipped none of them
# and both commands failed with "data file not found".
freeports_dev = ["py.typed", "data/**/*", "lib/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: bootstraps a repository, which is twenty-odd process starts; deselected by default, run with `make test-python-slow`",
]
# Deselected rather than absent. The two fixtures that bootstrap a repository cost a little over two
# seconds between them, and the commit gate's whole budget is five -- see `tests/conftest.py` for
# which fixtures those are and why the marking is derived from them rather than written by hand.
# `make test-python-slow` runs them and records that it did, so a commit that has not seen them says
# so rather than looking as though it has.
addopts = "-m 'not slow'"
# `src` first, so that what is tested is the working tree and not the copy `pip install` left in
# the environment. Without it a change to `repo_init.py` would be checked against the previous
# release of it, which is the one way a suite can pass while the code it names is broken.
pythonpath = ["src"]
