[project]
name = "freeports"
description = "Script for dumping a csv from different finance reports about ethical aspects"
# No `readme` field: the old `freeports_core/pyproject.toml` declared `readme = "README.md"` but
# no such file ever existed there either (confirmed) — setuptools tolerated the dangling
# reference silently, but maturin errors out on it at build time, so it's dropped here rather
# than fabricated. Not a behavior change: this metadata was already inert.
requires-python = ">=3.8"
license = "GPL-3.0"
version = "v0.0.1"
license-files = [
    "LICENSE"
]
authors = [
    {name = "Oreste Sciacqualegni", email = "orestesciacqualegni@tutanota.com"},
]
maintainers = [
    {name = "Oreste Sciacqualegni",  email = "orestesciacqualegni@tutanota.com"},
]
dependencies = [
    "PyXDG",
    "importlib_resources",
    "rapidfuzz",
    "dotenv",
    "pyyaml",
    "pandas",
    "numpy",
    "scikit-image",
    "pillow",
    "requests",
    "PyMuPDF",
    "lxml",
    "pydantic",
    "pandera",
]
keywords = [
    "finance",
    "pdf",
    "ethic",
    "economy",
    "datascience"
]

[project.urls]
github = "https://github.com/tvp-freeports/analysis_finance_reports"
documentation = "https://docs.freeports.org"
homepage = "https://www.freeports.org"

[project.scripts]
freeports = "freeports._internals.cli.cmd:cmd"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Mixed layout: the `freeports_engine` compiled extension (this crate's `[lib]` cdylib target,
# via PyO3) is shipped as its own top-level package, and the pure-Python `freeports` package
# (the public API, `python/freeports/`) rides along in the same wheel — see
# `agent-memory/freeports-core-consolidation-plan.md` for how this was verified empirically
# (`python-packages` is the key that makes maturin include a second, differently-named
# top-level pure-Python package alongside the one matching `module-name`).
python-source = "python"
module-name = "freeports_engine"
python-packages = ["freeports"]
# Confirmed (see the consolidation plan's "Domande aperte"/final report): maturin does NOT
# support shipping the companion `[[bin]] freeports` binary (packages/freeports_engine/src/main.rs)
# in this same wheel — a `--bindings pyo3` build (the default here, since this crate depends on
# pyo3) silently ignores `[[bin]]` targets, and a `--bindings bin` build produces a *separate*,
# non-abi3 wheel (tied to one exact CPython build) containing only the binary, incompatible with
# `[project.scripts]`. The native binary must still be built (`cargo build --release` in this
# directory) and copied next to the installed `freeports_engine` extension module by hand — same
# manual step this repo already documented before this consolidation (see `cmd.py`'s
# `_native_binary_path`), just retargeted to the new install location.

[tool.pytest.ini_options]
pythonpath = "python/"
testpaths = [
    "tests",
    "benchmarks",
]
norecursedirs = [
    "pages",
    "out"
]
markers = [
    "online_tests: mark test as an test that requires an internet conncetion to avoid running on each commit",
    "benchmarks: mark a test like a benchmark that record statistics about the execution time"
]

python_files = ["test_*","test.py"]
addopts = [
    "--import-mode=importlib",
    "--benchmark-disable",
    "--benchmark-autosave",
    "--benchmark-min-time=0.2",
    "--benchmark-max-time=7",
    "--benchmark-warmup=on",
]
