[package]
name = "freeports-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "freeports_engine"
crate-type = ["cdylib","lib"]

# Explicit rather than relying on the `src/main.rs` default (which would name the binary after
# `[package].name`, i.e. `freeports-engine`) — the installed command is `freeports` (see
# `python/freeports/_internals/cli/cmd.py`'s `_native_binary_path`), and this
# is still a second compiled artifact from the `[lib]` cdylib target either way (see `main.rs`'s
# module doc for why that distinction matters), so naming it explicitly costs nothing.
[[bin]]
name = "freeports"
path = "src/main.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gettext = "0.4"
onig = "6.5.1"
once_cell = "1"
polars = { version = "0.51", features = ["csv"] }
flate2 = "1"
tar = "0.4"
ureq = "2"
url = "2"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
# Merged in from the former `freeports_lib` crate (Fase E, punto 4).
bitflags = "2.10.0"
ordered-float = "5.1.0"
# Merged in from the former `freeports_bin` crate (Fase E, punto 5) — only used by the `freeports`
# binary's `src/cli/batch.rs` (batch CSV reading).
csv = "1"

[dev-dependencies]
test-case = "3.3.1"
pretty_assertions = "1.4.1"
tempfile = "3"
# Additive to [dependencies.pyo3] below (Cargo unions features across dependency kinds for a
# single build unit) — only pulled in for `cargo test`, not the extension module build, so unit
# tests that need to construct/inspect pyclasses (see core::fund_change_name, core::py_date) can
# embed their own interpreter without requiring the extension to be loaded from Python first.
pyo3 = { version = "0.27.0", features = ["auto-initialize"] }


# `auto-initialize` merged in from the former `freeports_bin` crate (Fase E, punto 5) — needed by
# `src/main.rs` (the `freeports` binary), which embeds its own Python interpreter (`Python::attach`) rather
# than being loaded *by* one. Harmless for the `[lib]`/cdylib target (the extension module): that
# target is loaded by an already-running interpreter via PyO3's own `PyInit_freeports_engine`
# entry point and never calls `prepare_freethreaded_python`, so this feature's code path simply
# isn't exercised there — Cargo has no per-target feature selection within one package, so both
# targets necessarily share this one `[dependencies.pyo3]` declaration.
[dependencies.pyo3]
version = "0.27.0"
features = ["abi3-py38", "auto-initialize"]


[profile.release]
debug = "line-tables-only"

[build]
rustflags = ["-C", "force-frame-pointers=yes","-C","symbol-mangling-version=v0"]
