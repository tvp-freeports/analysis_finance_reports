[package]
name = "freeports"
version = "0.1.0"
edition = "2024"

[lib]
name = "freeports"
crate-type = ["cdylib","lib"]

[[bin]]
name = "freeports"
path = "src/main.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gettext = "0.4"
onig = "6.5.1"
once_cell = "1"
polars = { version = "0.51", features = ["csv"] }
flate2 = "1"
tar = "0.4"
ureq = "2"
url = "2"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
bitflags = "2.10.0"
ordered-float = "5.1.0"
csv = "1"

[dev-dependencies]
test-case = "3.3.1"
pretty_assertions = "1.4.1"
tempfile = "3"
pyo3 = { version = "0.27.0", features = ["auto-initialize"] }


[dependencies.pyo3]
version = "0.27.0"
features = ["abi3-py38", "auto-initialize"]


[profile.release]
debug = "line-tables-only"

[build]
rustflags = ["-C", "force-frame-pointers=yes","-C","symbol-mangling-version=v0"]
