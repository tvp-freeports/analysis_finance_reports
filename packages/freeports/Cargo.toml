[package]
name = "freeports"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[lib]
name = "freeports"
# `cdylib` produces the `freeports` extension module importable from Python (M10, `src/python.rs`);
# `rlib` stays because the binary and the tests link it as an ordinary library.
#
# **No PyO3 `extension-module` feature**, on purpose: that feature tells PyO3 *not* to link
# libpython, which is right for a pure extension but would break the `freeports` binary, which
# embeds Python (`auto-initialize`, needed for PyMuPDF and for author-written modules). The `.so`
# therefore ships with a dynamic dependency on `libpython3.x.so` — the same choice the old
# `freeports_core` already made, and it works.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "freeports"
path = "src/main.rs"

[dependencies]
# --- logging ---------------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# --- regex: Oniguruma, not the `regex` crate (Python-compatible syntax) --------
onig = "6.5"
# --- serialisation ---------------------------------------------------------
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it, *reading* an f64 back from JSON is off by one ULP when its
# shortest decimal representation is not the one written. The worker jobs' reports (P1) are JSON,
# so without this feature a multi-process run produces different numbers from a sequential one
# -- see `cli::worker::tests::report_round_trip::a_float_survives_the_report_bit_for_bit`.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
csv = "1"
# --- thread parallelism over pages (P2) ------------------------------------
rayon = "1.10"
# --- utilities -------------------------------------------------------------
once_cell = "1"
bitflags = "2.10"
ordered-float = { version = "5.1", features = ["serde"] }
thiserror = "2"
# --- i18n / IO --------------------------------------------------------------
gettext = "0.4"
ureq = "2"
url = "2"
flate2 = "1"
tar = "0.4"
clap = { version = "4", features = ["derive"] }
# --- OS configuration-directory lookup (user tier, M9-implementation-plan.md §0 Q2) ------------
dirs = "6"
# --- the only bridge to Python: PyMuPDF and author-defined pipes -----------
pyo3 = { version = "0.27", features = ["auto-initialize"] }

[dev-dependencies]
test-case = "3.3"
pretty_assertions = "1.4"
tempfile = "3"

[profile.release]
debug = "line-tables-only"
