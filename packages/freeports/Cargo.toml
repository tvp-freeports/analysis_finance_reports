[package]
name = "freeports"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[lib]
name = "freeports"
# `cdylib` verra' aggiunto solo quando arriveranno gli shim PyO3 per l'API Python
# (fuori dallo scope di questa fase, vedi `PLAN.md`).
crate-type = ["rlib"]

[[bin]]
name = "freeports"
path = "src/main.rs"

[dependencies]
# --- logging ---------------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# --- regex: Oniguruma, non il crate `regex` (sintassi compatibile con Python) --
onig = "6.5"
# --- serializzazione -------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
csv = "1"
# --- utilita' ---------------------------------------------------------------
once_cell = "1"
bitflags = "2.10"
ordered-float = { version = "5.1", features = ["serde"] }
thiserror = "2"
# --- i18n / IO --------------------------------------------------------------
gettext = "0.4"
ureq = "2"
url = "2"
flate2 = "1"
tar = "0.4"
clap = { version = "4", features = ["derive"] }
# --- unico ponte verso Python: PyMuPDF e i pipe definiti dall'autore --------
pyo3 = { version = "0.27", features = ["auto-initialize"] }

[dev-dependencies]
test-case = "3.3"
pretty_assertions = "1.4"
tempfile = "3"

[profile.release]
debug = "line-tables-only"
