[package]
name = "freeports"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[lib]
name = "freeports"
# `cdylib` produce il modulo d'estensione `freeports` importabile da Python (M10, `src/python.rs`);
# `rlib` resta perche' il binario e i test lo linkano come libreria normale.
#
# **Niente feature `extension-module` di PyO3**, di proposito: quella feature dice a PyO3 di *non*
# linkare libpython, che e' giusto per una estensione pura ma romperebbe il binario `freeports`,
# che Python lo incorpora (`auto-initialize`, gli serve per PyMuPDF e per i moduli d'autore). Il
# `.so` esce quindi con una dipendenza dinamica da `libpython3.x.so` — stessa scelta gia' fatta
# dal vecchio `freeports_core`, e funzionante.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "freeports"
path = "src/main.rs"

[dependencies]
# --- logging ---------------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# --- regex: Oniguruma, non il crate `regex` (sintassi compatibile con Python) --
onig = "6.5"
# --- serializzazione -------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
csv = "1"
# --- utilita' ---------------------------------------------------------------
once_cell = "1"
bitflags = "2.10"
ordered-float = { version = "5.1", features = ["serde"] }
thiserror = "2"
# --- i18n / IO --------------------------------------------------------------
gettext = "0.4"
ureq = "2"
url = "2"
flate2 = "1"
tar = "0.4"
clap = { version = "4", features = ["derive"] }
# --- ricerca directory di configurazione OS (tier utente, M9-implementation-plan.md §0 Q2) -----
dirs = "6"
# --- unico ponte verso Python: PyMuPDF e i pipe definiti dall'autore --------
pyo3 = { version = "0.27", features = ["auto-initialize"] }

[dev-dependencies]
test-case = "3.3"
pretty_assertions = "1.4"
tempfile = "3"

[profile.release]
debug = "line-tables-only"
