[project]
name = "freeports"
description = "Estrazione di dati etici e finanziari da report di fondi d'investimento"
requires-python = ">=3.10"
license = "GPL-3.0"
version = "0.1.0"
authors = [
    {name = "Oreste Sciacqualegni", email = "orestesciacqualegni@tutanota.com"},
]
dependencies = [
    "PyMuPDF",
]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
# No `python-source`: the Python package **is** the compiled extension. The old `freeports_core`
# had a `python/freeports/` tree re-exporting from `freeports._native`; that layer no longer exists
# here (see the doc-comment of `src/python.rs`).
#
# `module-name` must match the name of the outer `#[pyo3::pymodule]` in `src/python.rs`: maturin
# looks for the symbol `PyInit_<last component>`, and a mismatch makes the import fail.
module-name = "freeports"
