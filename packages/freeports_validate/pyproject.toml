[project]
name = "freeports-validate"
description = "Validation tools for freeports format repositories"
requires-python = ">=3.8"
license = "GPL-3.0"
version = "0.0.1"
authors = [
    {name = "Oreste Sciacqualegni", email = "orestesciacqualegni@tutanota.com"},
]
dependencies = [
    "freeports",
]

[project.urls]
github = "https://github.com/tvp-freeports/analysis_finance_reports"
documentation = "https://docs.freeports.org"
homepage = "https://www.freeports.org"

[project.scripts]
freeports-validate = "freeports_validate.cli:main"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
freeports_validate = [
    "bin/*",
    "lib/*",
    "lib/*.sh",
    "lib/*.json",
    "lib/*.yaml",
    "docs/**/*.rst",
]
