[project]
name = "freeports-validate"
description = "Validation tools for freeports format repositories"
requires-python = ">=3.8"
license = "GPL-3.0"
version = "0.0.1"
authors = [
    {name = "Oreste Sciacqualegni", email = "orestesciacqualegni@tutanota.com"},
]
# The command is a set of shell scripts, so its dependencies are programs rather than modules.
# The two that can be declared are, because leaving them undeclared is what makes a fresh install
# fail at the first subcommand with a bare "command not found".
#
# `yq` here is the **Python** one (kislyuk), a thin wrapper around jq: the expression language is
# jq's, which is why this project standardises on it rather than on the unrelated Go program of the
# same name. It shells out to the `jq` binary, which — like `gpg`, `sha256sum` and `realpath` —
# cannot be expressed here and has to come from the system.
dependencies = [
    "yq",
    "check-jsonschema",
]

[project.urls]
github = "https://github.com/tvp-freeports/analysis_finance_reports"
documentation = "https://docs.freeports.org"
homepage = "https://www.freeports.org"

[project.scripts]
freeports-validate = "freeports_validate.cli:main"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
freeports_validate = [
    "bin/*",
    "lib/*",
    "lib/*.sh",
    "lib/*.json",
    "lib/*.yaml",
    "docs/**/*.rst",
]
