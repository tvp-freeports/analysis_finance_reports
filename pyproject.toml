[project]
name = "freeports_analysis"
description = "Script for dumping a csv from different finance reports about ethical aspects"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0"
license-files = [
    "LICENSE"
]
authors = [
    {name = "Oreste Sciacqualegni", email = "orestesciacqualegni@tutanota.com"},
]
maintainers = [
    {name = "Oreste Sciacqualegni",  email = "orestesciacqualegni@tutanota.com"},
]
dynamic = ["version"]
dependencies = [
    "PyXDG",
    "importlib_resources",
    "rapidfuzz",
    "dotenv",
    "pyyaml",
    "pandas",
    "requests",
    "PyMuPDF",
    "lxml",
    "pydantic",
    "pandera",
    "portion",
    "shapely"
]
keywords = [
    "finance",
    "pdf",
    "ethic",
    "economy",
    "datascience"
]

[project.urls]
github = "https://github.com/tvp-freeports/analysis_finance_reports"
documentation = "https://docs.freeports.org"
homepage = "https://www.freeports.org"

[project.scripts] 
freeports = "freeports_analysis.cmd:cmd"



[build-system]
requires = [
    "setuptools >= 77.0.3",
    "setuptools-scm>=8",
    "setuptools-rust"
]


build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools]
include-package-data = true


[tool.setuptools.package-data]
freeports_analysis = ["data/*","locales/*/*/*.mo"]


[[tool.setuptools-rust.ext-modules]]
# Private Rust extension module to be nested into the Python package
target = "freeports_lib"     # The last part of the name (e.g. "_lib") has to match lib.name in Cargo.toml,
                             # but you can add a prefix to nest it inside of a Python package.
path = "rust/Cargo.toml"     # Default value, can be omitted
binding = "PyO3"         # Default value, can be omitted



[tool.pytest.ini_options]
pythonpath = "src/"
testpaths = [
    "tests",
    "benchmarks",
]
norecursedirs = [
    "pages",
    "out"
]
markers = [
    "path: if given __file__ as an argument rapresent the location of the test (it's usued by fixtures to set the content)",
    "integration_tests: mark test as an integration test (supposingly slow) to avoid running on each commit",
    "online_tests: mark test as an test that requires an internet conncetion to avoid running on each commit",
    "benchmarks: mark a test like a benchmark that record statistics about the execution time"
]
filterwarnings = [
    'ignore:builtin type .* has no __module__ attribute:DeprecationWarning'
]
python_files = ["test_*","test.py"]
addopts = [
    "--import-mode=importlib",
    "--benchmark-autosave",
    "--benchmark-min-time=0.2",
    "--benchmark-max-time=7",
    "--benchmark-warmup=on",
]

[tool.pylint."TYPECHECK"]
extension-pkg-allow-list = ["lxml.etree"]

