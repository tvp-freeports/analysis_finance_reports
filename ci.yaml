# How this repository is gated. The same file, the same name and the same syntax in every
# freeports repository — the engine, a formats repository, an input database — so that the roles
# of the branches read the same everywhere.
#
# `package.yaml` and `metadata.yaml` say what a repository *is*. This file says how it is *gated*,
# which is a different question with a different audience. Nothing here describes the repository.
#
# Every setting is also reachable from the environment and the command line, per setting:
#   thresholds     --min tests.rust.lines=95      FREEPORTS_CI_MIN_TESTS_RUST_LINES
#   branch class   --branch-class prod            FREEPORTS_CI_BRANCH_CLASS
#   key server     --keyserver URL                FREEPORTS_VALIDATE_KEYSERVER
#
# `freeports-dev branch-class` prints the class of the branch you are on and the rule that
# produced it. It is the first thing to run when a commit hook does something unexpected.

branches:
  # A missed threshold, a failing suite or a figure nobody could measure refuses the commit.
  prod: [main, master, "release/*"]
  # Everything is measured and reported; nothing refuses the commit.
  dev: [dev, generalization, M0]
  # The hook does nothing at all.
  off: [experimental, "wip/*", "spike/*"]
  # Anything unlisted. `dev` unless said otherwise: a branch nobody classified is not production.
  default: dev

keyserver: https://keys.openpgp.org

# Seeded at the figures measured on 2026-09-08, never at an aspiration. A threshold above the
# baseline locks the repository out at the first gated commit, and the pipeline that preceded this
# one is the demonstration: it asked for 90 % of a documentation figure that read 25.93 %.
#
# Raise these deliberately, one at a time, in a commit that says so. A metric named nowhere here is
# reported and gates nothing — which is what the metrics whose measurement is not built yet are.
thresholds:
  tests.rust.lines: 91                            # measured 91.18 % (28548/31311)
  tests.python.lines: 32                          # measured 32.62 % (561/1720)
  tests.python.freeports_dev.lines: 27            # measured 27.69 % (438/1582)
  tests.python.freeports_validate.lines: 89       # measured 89.13 % (123/138), Python half only
  docs.rust: 39                                   # measured 39.4 % over 957 items
  docs.python: 49                                 # measured 49.12 % (112/228 public objects)
  docs.python.freeports_dev: 47                   # measured 47.29 % (96/203)
  docs.python.freeports_validate: 64              # measured 64.00 % (16/25)
  lint.rust: 9.9                                  # measured 9.998 (8 clippy warnings / 44617 lines)
  lint.python: 10                                 # measured 10.00 (0 ruff violations / 8606 lines)
  grants.coverage: 100                            # measured 100 % (1/1)
  grants.keys_online: 100                         # measured 100 % (1/1) — key published 2026-09-09
