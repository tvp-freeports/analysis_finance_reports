# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04

  tools:
    python: "3.13"
    rust: "latest"

  jobs:
    build:
      html:
        - |
          set -e

          echo "Python:"
          which python
          python --version
          python -m pip --version

          echo "Sphinx:"
          which sphinx-build
          sphinx-build --version

          echo "Rust:"
          which cargo
          cargo --version
          rustc --version

          # The repository's Makefile uses ENV_PREFIX/VIRTUAL_ENV to select
          # its Python environment. Read the active Python prefix and expose
          # its bin directory through PATH.
          PYTHON_PREFIX="$(python -c "import sys; print(sys.prefix)")"
          export PATH="$PYTHON_PREFIX/bin:$PATH"

          echo "Documentation environment:"
          echo "  Python prefix: $PYTHON_PREFIX"
          echo "  sphinx-build: $(command -v sphinx-build)"

          # Generate Rust API documentation before building the Sphinx site.
          make -C docs rustdoc

          case "$READTHEDOCS_LANGUAGE" in
            en)
              echo "Building English documentation"
              make -C docs docs-html
              SOURCE="docs/build/html"
              ;;

            *)
              echo "Building documentation for language: $READTHEDOCS_LANGUAGE"
              make -C docs docs-lang DOCLANG="$READTHEDOCS_LANGUAGE"
              SOURCE="docs/build/$READTHEDOCS_LANGUAGE"
              ;;
          esac

          if [ ! -d "$SOURCE" ]; then
            echo "ERROR: documentation output directory does not exist: $SOURCE"
            exit 1
          fi

          mkdir -p "$READTHEDOCS_OUTPUT/html"
          cp -a "$SOURCE/." "$READTHEDOCS_OUTPUT/html/"

python:
  install:
    - requirements: contrib/requirements.docs.txt

    - method: pip
      path: packages/freeports

    - method: pip
      path: packages/freeports_dev

    - method: pip
      path: packages/freeports_validate
