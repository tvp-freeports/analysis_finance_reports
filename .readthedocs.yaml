# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    # Needed twice over: to compile the PyO3 extension autodoc imports, and to generate rustdoc,
    # which the site publishes as a sub-path instead of transcribing it by hand into `.rst`.
    rust: "latest"
  jobs:
    pre_build:
      # The same target used locally, so that the published site and the one built on the
      # writer's screen do not diverge. It deposits `cargo doc` into
      # `docs/source/_extra/rustdoc/`, from where `html_extra_path` copies it into the site.
      - make -C docs rustdoc

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: contrib/requirements.docs.txt
    # autodoc really imports the packages: they must be installed, not mocked. `freeports` is
    # built by maturin (declared in its `build-system`), which is why the Rust toolchain above is
    # needed.
    - method: pip
      path: packages/freeports
    - method: pip
      path: packages/freeports_dev
    - method: pip
      path: packages/freeports_validate
