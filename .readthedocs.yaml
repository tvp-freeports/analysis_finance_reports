# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04

  tools:
    python: "3.13"
    rust: "latest"

  jobs:
    pre_build:
      # Verify the toolchains provided by Read the Docs.
      - which python
      - python --version
      - python -m pip --version
      - which cargo
      - cargo --version
      - rustc --version

      # Generate the Rust API documentation.
      #
      # This is the repository-specific step that deposits rustdoc under
      # docs/source/_extra/rustdoc/, where Sphinx includes it in the site.
      - make -C docs rustdoc

    build:
      html:
        - |
          set -e

          echo "Python:"
          which python
          python --version

          echo "Sphinx:"
          which sphinx-build
          sphinx-build --version

          case "$READTHEDOCS_LANGUAGE" in
            en)
              echo "Building English documentation"

              sphinx-build \
                -b html \
                docs/source \
                docs/build/html

              SOURCE="docs/build/html"
              ;;

            *)
              echo "Building documentation for language: $READTHEDOCS_LANGUAGE"

              sphinx-build \
                -b html \
                -D language="$READTHEDOCS_LANGUAGE" \
                docs/source \
                "docs/build/$READTHEDOCS_LANGUAGE"

              SOURCE="docs/build/$READTHEDOCS_LANGUAGE"
              ;;
          esac

          if [ ! -d "$SOURCE" ]; then
            echo "ERROR: documentation output directory does not exist: $SOURCE"
            exit 1
          fi

          mkdir -p "$READTHEDOCS_OUTPUT/html"
          cp -a "$SOURCE/." "$READTHEDOCS_OUTPUT/html/"

python:
  install:
    # Documentation dependencies, including Sphinx, the RTD theme,
    # MyST and the translation tools.
    - requirements: contrib/requirements.docs.txt

    # autodoc imports the actual packages, so install them rather than
    # mocking them.
    #
    # freeports contains the PyO3/Rust extension and is built through
    # maturin as declared by its pyproject.toml build-system configuration.
    - method: pip
      path: packages/freeports

    - method: pip
      path: packages/freeports_dev

    - method: pip
      path: packages/freeports_validate
