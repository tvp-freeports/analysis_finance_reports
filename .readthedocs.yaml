# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04

  tools:
    python: "3.13"
    rust: "latest"

  jobs:
    pre_build:
      # The repository's Rust documentation is generated separately from
      # Sphinx and then included by the Sphinx site.
      #
      # Output:
      #   docs/source/_extra/rustdoc/
      - which cargo
      - cargo --version
      - rustc --version
      - make -C docs rustdoc

sphinx:
  configuration: docs/source/conf.py
  builder: html

python:
  install:
    # Dependencies required by the documentation build, including Sphinx,
    # the RTD theme, MyST and the translation tools.
    - requirements: contrib/requirements.docs.txt

    # Sphinx autodoc imports these packages, so they must be installed.
    - method: pip
      path: packages/freeports

    - method: pip
      path: packages/freeports_dev

    - method: pip
      path: packages/freeports_validate
