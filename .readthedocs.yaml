# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04

  tools:
    python: "3.13"

    # Required to build the PyO3 extension used by autodoc and to
    # generate the Rust API documentation published with the site.
    rust: "latest"

  jobs:
    build:
      html:
        - |
          set -e

          # Read the Python environment selected by Read the Docs.
          #
          # The repository Makefile uses VIRTUAL_ENV to determine which
          # Python environment it should use. Export the environment used
          # by Read the Docs so that the Makefile does not fall back to
          # venv/freeports-dev.
          export VIRTUAL_ENV="$(python -c 'import sys; print(sys.prefix)')"
          export PATH="$VIRTUAL_ENV/bin:$PATH"

          echo "Python:"
          which python
          python --version
          python -m pip --version

          echo "Sphinx:"
          which sphinx-build
          sphinx-build --version

          echo "Rust:"
          which cargo
          cargo --version
          rustc --version

          # Generate Rust API documentation before building the Sphinx site.
          # The generated files are written to:
          #
          #     docs/source/_extra/rustdoc/
          #
          # and are included in the final documentation through Sphinx.
          make -C docs rustdoc

          case "$READTHEDOCS_LANGUAGE" in
            en)
              echo "Building English documentation"
              make -C docs docs-html
              SOURCE="docs/build/html"
              ;;

            *)
              echo "Building documentation for language: $READTHEDOCS_LANGUAGE"
              make -C docs docs-lang DOCLANG="$READTHEDOCS_LANGUAGE"
              SOURCE="docs/build/$READTHEDOCS_LANGUAGE"
              ;;
          esac

          # Fail explicitly if Sphinx did not produce the expected output.
          if [ ! -d "$SOURCE" ]; then
            echo "ERROR: documentation output directory does not exist: $SOURCE"
            exit 1
          fi

          mkdir -p "$READTHEDOCS_OUTPUT/html"
          cp -a "$SOURCE/." "$READTHEDOCS_OUTPUT/html/"

python:
  install:
    # Documentation dependencies:
    # Sphinx, the RTD theme, MyST, sphinx-intl and Babel.
    - requirements: contrib/requirements.docs.txt

    # autodoc imports the real packages, so they must be installed rather
    # than mocked.
    #
    # freeports contains the PyO3/Rust extension and is built through
    # maturin as declared by its pyproject.toml build-system configuration.
    - method: pip
      path: packages/freeports

    - method: pip
      path: packages/freeports_dev

    - method: pip
      path: packages/freeports_validate
